name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node src/generate.mjs --out dist

            - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/heads/output; then
            git switch output
            git rm -rf . || true
          else
            git switch --orphan output
            git rm -rf . || true
          fi

          cp -R dist/. .

          git add .
          git commit -m "Update Pac-Man contribution graph" || true
          git push origin output --force
